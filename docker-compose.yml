# Run with: docker compose up postgres
# API:  cd apps/api && bun dev
# Web:  cd apps/web && bun dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: znab
      POSTGRES_PASSWORD: znab
      POSTGRES_DB: znab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U znab -d znab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
